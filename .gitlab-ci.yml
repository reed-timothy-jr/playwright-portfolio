# GitLab CI — reference implementation of the framework's gate contract.
# Same gates, same order as .github/workflows/ci.yml:
#   install -> lint -> typecheck -> tests (five pillars + support) -> dependency audit -> evidence
# The Playwright image ships browsers + OS deps, so no browser install step is needed.
image: mcr.microsoft.com/playwright:v1.55.0-noble

stages:
  - verify

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

verify:
  stage: verify
  script:
    - npm ci
    - npm run lint
    - npm run typecheck
    - npm run test:all
    # Dependency audit gate (high+ severity fails the build).
    - npm run audit:sec
  after_script:
    # First-attempt vs retry breakdown — retries hide rot, this makes it visible.
    - npm run report:flakiness
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - playwright-report/
      - test-results/
