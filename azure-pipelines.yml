# Azure Pipelines — reference implementation of the framework's gate contract.
# Same gates, same order as .github/workflows/ci.yml:
#   install -> lint -> typecheck -> tests (five pillars + support) -> dependency audit -> evidence
trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Use Node 20'

  - script: npm ci
    displayName: 'Install dependencies'

  - script: npx playwright install --with-deps chromium
    displayName: 'Install Playwright browsers'

  - script: npm run lint
    displayName: 'Gate: lint'

  # Typecheck is explicit because Playwright transpiles TypeScript without type-checking it.
  - script: npm run typecheck
    displayName: 'Gate: typecheck'

  - script: npm run test:all
    displayName: 'Gate: five pillars + support projects'

  # Dependency audit gate (high+ severity fails the build).
  - script: npm run audit:sec
    displayName: 'Gate: dependency audit'

  # First-attempt vs retry breakdown — retries hide rot, this makes it visible.
  - script: npm run report:flakiness
    displayName: 'Flakiness report'
    condition: always()

  - task: PublishPipelineArtifact@1
    condition: always()
    inputs:
      targetPath: '$(Build.SourcesDirectory)/playwright-report'
      artifact: 'playwright-report'
    displayName: 'Publish HTML report'

  - task: PublishPipelineArtifact@1
    condition: always()
    inputs:
      targetPath: '$(Build.SourcesDirectory)/test-results'
      artifact: 'test-results'
    displayName: 'Publish test results and evidence'
