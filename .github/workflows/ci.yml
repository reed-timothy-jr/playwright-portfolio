name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Gates: lint → typecheck → tests. Typecheck is explicit because
      # Playwright transpiles TypeScript without type-checking it.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:all

      # Dependency audit gate (high+ severity fails the build).
      - run: npm run audit:sec

      # First-attempt vs retry breakdown — retries hide rot, this makes it visible.
      - run: npm run report:flakiness
        if: always()

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
